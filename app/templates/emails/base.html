<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{% block title %}{{ brand }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#0b0b10;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e9e7f2;">
<span style="display:none;max-height:0;overflow:hidden;">{% block preheader %}{% endblock %}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b10;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
      <tr><td style="padding:0 0 20px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="width:32px;height:32px;background:#7c5cff;border-radius:9px;text-align:center;color:#fff;font-weight:700;font-size:16px;line-height:32px;">&#9650;</td>
          <td style="padding-left:10px;font-size:17px;font-weight:700;color:#ffffff;">{{ brand }}</td>
        </tr></table>
      </td></tr>
      <tr><td style="background:#15141c;border:1px solid #2a2836;border-radius:14px;padding:32px 28px;">
        {% block content %}{% endblock %}
      </td></tr>
      <tr><td style="padding:20px 4px 0 4px;font-size:12px;line-height:1.6;color:#8a879a;">
        {% block footer %}You received this email because of activity on your {{ brand }} account. If this wasn't you, you can safely ignore it.{% endblock %}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
